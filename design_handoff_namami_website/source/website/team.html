<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team — Namami Law Offices</title>
<link rel="stylesheet" href="../_ds/namami-law-offices-design-system-f396ce03-b7ed-4154-bc1d-77ea8ff6edbb/tokens/fonts.css">
<link rel="stylesheet" href="../_ds/namami-law-offices-design-system-f396ce03-b7ed-4154-bc1d-77ea8ff6edbb/tokens/colors.css">
<link rel="stylesheet" href="../_ds/namami-law-offices-design-system-f396ce03-b7ed-4154-bc1d-77ea8ff6edbb/tokens/typography.css">
<link rel="stylesheet" href="../_ds/namami-law-offices-design-system-f396ce03-b7ed-4154-bc1d-77ea8ff6edbb/tokens/spacing.css">
<link rel="stylesheet" href="../_ds/namami-law-offices-design-system-f396ce03-b7ed-4154-bc1d-77ea8ff6edbb/styles.css">
<script src="../_ds/namami-law-offices-design-system-f396ce03-b7ed-4154-bc1d-77ea8ff6edbb/_ds_bundle.js"></script>
<link rel="stylesheet" href="site.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script type="text/babel" src="Layout.jsx"></script>
<script type="text/babel">
const { Eyebrow, Tag } = window.NamamiLawOfficesDesignSystem_f396ce;

function InitialAvatar({ name }) {
  const initials = name.split(' ').map((w) => w[0]).join('');
  return (
    <div style={{ width: 84, height: 84, borderRadius: '50%', background: 'var(--color-charcoal)',
      color: 'var(--color-saffron)', display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontSize: '1.5rem', fontWeight: 600, flex: 'none' }}>{initials}</div>
  );
}

function TeamCard({ member, className }) {
  return (
    <div className={className} style={{ border: '1px solid var(--line-on-light)', borderTop: '3px solid var(--color-charcoal)',
      borderRadius: 'var(--radius-sm)', padding: '28px 26px' }}>
      <div style={{ display: 'flex', gap: 18, alignItems: 'center' }}>
        <InitialAvatar name={member.name} />
        <div>
          <div style={{ fontSize: '1.2rem', fontWeight: 600, letterSpacing: '-.015em' }}>{member.name}</div>
          <div style={{ fontSize: '.86rem', fontWeight: 400, color: 'var(--color-gold)', marginTop: 2 }}>{member.role}</div>
        </div>
      </div>
      <p style={{ fontSize: '.94rem', fontWeight: 300, lineHeight: 1.62, color: '#3a3a3c', marginTop: 18 }}>{member.bio}</p>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginTop: 18 }}>
        {member.focus.map((f) => <Tag key={f}>{f}</Tag>)}
      </div>
    </div>
  );
}

function Page() {
  const { SECTION, H2, PD, Ellipse } = window;
  return (
    <window.Shell active="team.html">
      <section style={{ ...SECTION, background: 'var(--color-charcoal)', color: 'var(--color-cream)',
        minHeight: '46vh', display: 'flex', flexDirection: 'column', justifyContent: 'center' }} data-screen-label="Team — Hero">
        <Ellipse pos="tr" />
        <window.MarkWatermark side="right" />
        <div className="nm-reveal" style={{ position: 'relative', zIndex: 1, maxWidth: 820 }}>
          <Eyebrow tone="saffron">The Team</Eyebrow>
          <div className="nm-mask nm-reveal">
            <h1 style={{ fontSize: 'clamp(2.4rem,5vw,4rem)', fontWeight: 600, letterSpacing: '-.03em',
              lineHeight: 1.02, margin: '18px 0 0' }}>Partner-level attention, by design<span style={PD}>.</span></h1>
          </div>
        </div>
      </section>

      <section style={{ ...SECTION, background: 'var(--color-cream)' }}>
        <div className="nm-reveal-group" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(320px,1fr))', gap: 26 }}>
          {window.TEAM.map((m) => <TeamCard className="nm-reveal" key={m.name} member={m} />)}
        </div>
      </section>

      <section className="nm-reveal" style={{ ...SECTION, background: 'var(--color-stone)', paddingTop: 56, paddingBottom: 56 }}>
        <Eyebrow>International Network</Eyebrow>
        <p style={{ fontSize: '1.1rem', fontWeight: 300, lineHeight: 1.55, color: 'var(--color-charcoal)',
          marginTop: 16, maxWidth: '60ch' }}>
          For matters that cross borders, we coordinate with a network of associate counsel across the
          <b> UAE, US, EU, UK, and ASEAN</b> — local expertise, global coordination.
        </p>
      </section>
    </window.Shell>
  );
}
(function wait(){ if(window.Shell){ ReactDOM.createRoot(document.getElementById('app')).render(<Page />); } else { setTimeout(wait, 50); } })();
</script>
</body>
</html>
