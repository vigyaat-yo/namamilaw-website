<body>
<div id="app"></div>
<script src="data.js"></script>
<script type="text/babel" src="Layout.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;
const { Eyebrow, Button } = window.NamamiLawOfficesDesignSystem_f396ce;

function Page() {
  const { SECTION, H2, PD, Ellipse } = window;
  const [name, setName] = useState('');
  useEffect(() => {
    try {
      const saved = JSON.parse(sessionStorage.getItem('nm-last-enquiry') || '{}');
      if (saved.name) setName(saved.name.split(' ')[0]);
    } catch (e) {}
  }, []);
  return (
    <window.Shell active="">
      <section style={{ ...SECTION, background: 'var(--color-charcoal)', color: 'var(--color-cream)',
        minHeight: '80vh', display: 'flex', flexDirection: 'column', justifyContent: 'center' }} data-screen-label="Thank You">
        <Ellipse pos="tr" />
        <window.MarkWatermark side="right" />
        <div className="nm-reveal" style={{ position: 'relative', zIndex: 1, maxWidth: 760 }}>
          <Eyebrow tone="saffron">Enquiry Received</Eyebrow>
          <div className="nm-mask nm-reveal">
            <h1 style={{ fontSize: 'clamp(2.4rem,5vw,4rem)', fontWeight: 600, letterSpacing: '-.03em',
              lineHeight: 1.04, margin: '20px 0 0' }}>
              Thank you{name ? ', ' + name : ''}<span style={PD}>.</span>
            </h1>
          </div>
          <p style={{ fontSize: 'clamp(1.05rem,1.5vw,1.3rem)', fontWeight: 300, lineHeight: 1.55,
            maxWidth: '48ch', color: 'rgba(249,245,239,.72)', marginTop: 24 }}>
            We've received your enquiry and will respond within one business day. If your matter is
            time-sensitive, please mention it when we follow up.
          </p>
          <div style={{ display: 'flex', gap: 14, marginTop: 34, flexWrap: 'wrap' }}>
            <window.Magnetic><Button variant="accent" onClick={() => window.nmGo('index.html')}>Back to Home</Button></window.Magnetic>
            <window.Magnetic><Button variant="ghost-inverse" onClick={() => window.nmGo('insights.html')}>Read our Insights</Button></window.Magnetic>
          </div>
        </div>
      </section>
    </window.Shell>
  );
}
(function wait(){ if(window.Shell){ ReactDOM.createRoot(document.getElementById('app')).render(<Page />); } else { setTimeout(wait, 50); } })();
</script>
</body>
</html>
